name: CI
on:
  pull_request:
  push:
    branches:
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: 17
        distribution: temurin
    - uses: coursier/cache-action@v9
    - uses: sbt/setup-sbt@v1
    - run: sbt
           -v
           --server
           "+scalafmtCheckAll"
           scalafmtSbtCheck
           "+test"
